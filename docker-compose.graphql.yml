services:

  product-dgs:
    build:
      context: ./src/product-dgs
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "4001:4001"

  currency-dgs:
    build:
      context: ./src/currency-dgs
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "4002:4002"

  cart-dgs:
    build:
      context: ./src/cart-dgs
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "4003:4003"

  recommendation-dgs:
    build:
      context: ./src/recommendation-dgs 
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "4004:4004"
      
  gateway:
    build:
      context: ./src/gateway

    environment:
      PRODUCT_DGS_URL: http://product-dgs:4001
      CURRENCY_DGS_URL: http://currency-dgs:4002
      CART_DGS_URL: http://cart-dgs:4003
      RECOMMENDATION_DGS_URL: http://recommendation-dgs:4004

    ports:
      - "4000:4000"

    depends_on:
      - product-dgs
      - currency-dgs
      - cart-dgs
      - recommendation-dgs