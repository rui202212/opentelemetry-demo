services:
  frontend:
    image: ghcr.io/open-telemetry/demo:latest-frontend
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PRODUCT_CATALOG_ADDR=product-catalog:8080
      - CART_ADDR=cart:8080
    depends_on:
      - product-catalog
      - cart
      - otel-collector

  product-catalog:
    image: ghcr.io/open-telemetry/demo:latest-product-catalog
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector

  valkey:
    image: valkey/valkey:latest

  cart:
    image: ghcr.io/open-telemetry/demo:latest-cart
    environment:
      - VALKEY_ADDR=valkey:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - valkey
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-config-minimal.yml:/otel-config.yml
    command:
      - "--config=/otel-config.yml"